name: Docs

# The documentation is Storybook: every component's written explanation lives above the
# component and is rendered by addon-docs, so publishing the site is publishing the prose that
# is already in the source.
on:
  push:
    branches: [master]
  # So a broken docs build can be caught before it is merged, without publishing anything.
  pull_request:
  workflow_dispatch:

# One deployment at a time, and a push in flight is not worth cancelling halfway through a
# publish — unlike CI, where the newest commit is the only one that matters.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build Storybook
        # Pages serves the site from /<repository>/, which Vite has to know at build time or
        # every asset resolves against the domain root and the page loads blank.
        env:
          STORYBOOK_BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm build-storybook

      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    name: publish
    # Pull requests build the site to prove it still builds; only master publishes it.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
