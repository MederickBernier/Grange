name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push supersedes the run already in flight for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Its own job: lint and formatting fail for reasons that have nothing to do with the tests,
  # and finding out about both at once is better than one after the other. It is also the
  # fastest job, so a misplaced comma is reported in under a minute.
  style:
    name: lint, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The tokens first: the lint is type-aware, and src/tokens/generated is imported by the
      # files it reads.
      - run: pnpm tokens
      - run: pnpm lint
      - run: pnpm format:check

  verify:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Before setup-node, not after: `cache: pnpm` works out where the store lives by running
      # pnpm, so pnpm has to be on PATH by then. The version comes from package.json's
      # packageManager field, so one place pins it.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Each of these regenerates the tokens first, so they also cover the token pipeline.
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build-storybook

      - name: Check the published surface resolves
        run: |
          test -f dist/index.js
          test -f dist/index.d.ts
          # package.json exports this exact path as ./styles.css.
          test -f dist/index.css
          # react, motion and react-aria must stay external rather than being bundled in. The
          # subpath is optional because motion ships as motion/react and react as react/jsx-runtime.
          for external in react motion react-aria react-stately @internationalized/date; do
            grep -qE "from \"$external(/[^\"]*)?\"" dist/index.js || {
              echo "$external is not imported from dist/index.js — is it bundled?"; exit 1;
            }
          done

  visual:
    name: visual regression
    runs-on: ubuntu-latest
    # The same image the baselines in visual/__screenshots__ were taken in. Anything else would
    # compare them against a different renderer.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile

      - run: pnpm build-storybook

      - name: Compare every story against its baseline
        run: npx playwright test

      - name: Keep the diff images when something moved
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: |
            test-results/
            playwright-report/
          retention-days: 7
